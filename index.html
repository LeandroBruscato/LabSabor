<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendas – Laboratório de Sabores</title>
<style>
:root{--bg:#f3ead0;--card:#fffaf0;--ink:#2b2a1f;--mut:#6d684f;--line:#d9cc9f;--g:#4a7a37;--r:#c8262c;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2016;--card:#272b1d;--ink:#f1ead2;--mut:#b4ad8c;--line:#444a33;--g:#7fb264;--r:#e5565b}}
:root[data-theme="dark"]{--bg:#1d2016;--card:#272b1d;--ink:#f1ead2;--mut:#b4ad8c;--line:#444a33;--g:#7fb264;--r:#e5565b}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding:0 14px 90px}
h1{font:700 22px Georgia,"Times New Roman",serif;margin:16px 0 2px}h2{font:700 17px Georgia,serif;margin:18px 0 8px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
nav{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin:10px 0}
nav button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:600 15px inherit;color:var(--ink)}
nav button.on{background:var(--card);box-shadow:0 1px 2px #0003}
.seg{display:flex;gap:8px}.seg button{flex:1}
button,input,select{font:inherit;color:inherit}
.opt{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:11px;font-weight:600}
.opt.on{border-color:var(--g);background:var(--g);color:var(--on)}
.opt:disabled{opacity:.4}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.st{display:flex;align-items:center;gap:8px}.st button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:700}
.st b{min-width:28px;text-align:center}
.sum{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}.tot{font:700 20px Georgia,serif;border-top:1px solid var(--line);margin-top:6px;padding-top:8px!important}
.err{color:var(--r);font-weight:600;margin:8px 0;min-height:20px}
.go{width:100%;padding:15px;border:0;border-radius:12px;background:var(--r);color:#fff;font-weight:700;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line)}
.tag.p{background:var(--r);color:#fff}.tag.c{opacity:.6;text-decoration:line-through}
.sm{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13px;margin-left:6px}
.big{font:700 28px Georgia,serif}.hide{display:none}
#lg{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--bg);z-index:9;padding:18vh 20px 0;max-width:560px;margin:0 auto}
.toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:532px;margin:auto;background:var(--g);color:#fff;padding:13px;border-radius:12px;font-weight:600;text-align:center}
</style></head><body>
<div id="lg" class="hide"><h1>Entrar</h1><label>Usuário</label><input id="lu" autocomplete="username"><label>Senha</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="lge"></div><button class="go" id="lgb">Entrar</button></div>
<h1>Laboratório de Sabores</h1><p class="sub">Conectado: <span id="who"></span></p>
<nav><button id="t1" class="on" data-t="1">Nova venda</button><button id="t2" data-t="2">Relatórios</button></nav>

<section id="v1">
<div class="seg"><button class="opt on" data-type="final">Cliente final</button><button class="opt" data-type="b2b">B2B</button></div>
<label>Cliente (opcional)</label><input id="cli" placeholder="Nome do cliente">
<label>Data da venda</label><input id="dt" type="date">
<h2>Sabores <span class="sub" id="pr"></span></h2><div id="fl"></div>
<div id="b2bbox" class="hide">
<label>Frete (R$)</label><input id="fr" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00">
<label>Pagamento</label><div class="seg"><button class="opt on" data-st="pago">Pago</button><button class="opt" data-st="pendente">Pendente (a prazo)</button></div>
<div id="vbox" class="hide"><label>Vencimento</label><input id="venc" type="date"></div>
</div>
<div class="sum"><div><span>Unidades</span><span id="su">0</span></div><div><span>Produtos</span><span id="sp">R$ 0,00</span></div><div><span>Frete</span><span id="sf">R$ 0,00</span></div><div class="tot"><span>Total</span><span id="stt">R$ 0,00</span></div></div>
<div class="err" id="err"></div><button class="go" id="reg">Registrar venda</button>
</section>

<section id="v2" class="hide">
<div class="seg"><button class="opt on" data-p="dia">Dia</button><button class="opt" data-p="semana">Semana</button><button class="opt" data-p="mes">Mês</button></div>
<label>Data de referência</label><input id="ref" type="date">
<div class="card"><div class="sub" id="rng"></div><div class="big" id="rt">R$ 0,00</div><div class="sub" id="ru"></div></div>
<h2>Por sabor</h2><div id="rf"></div>
<h2>Pendentes em aberto</h2><div id="pd"></div>
<h2>Vendas do período</h2><div id="ls"></div>
<p class="sub"><a href="/api/backup">Baixar backup do banco</a></p>
</section>
<div id="toast" class="toast hide"></div>

<script>
var FL=["Amendoim","Banana","Banana com canela","Banana com canela e açúcar","Banana com açaí","Banana com açaí e açúcar","Cacau","Cacau com pimenta","Cacau sem açúcar","Cacau com pimenta sem açúcar","Goiaba","Goiaba sem açúcar","Cebola","Cebola com orégano e pimenta","Batata doce","Batata doce com lemon pepper","Grão de bico com alecrim","Grão de bico com pimenta","Morango","Morango com orégano"];
var C={pf:18,pb:16.5,min:35,prazo:30};
var $=function(i){return document.getElementById(i)};
var S={type:"final",st:"pago",q:{},per:"dia",conf:null},sales=[],ME=null;
function api(u,m,b){return fetch(u,{method:m||"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function load(){return ME&&ME.role=="admin"?api("/api/sales").then(function(j){sales=j;rep()}):Promise.resolve()}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function add(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function R(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function br(s){return s.split("-").reverse().join("/")}
function price(){return S.type=="b2b"?C.pb:C.pf}
function units(){return Object.values(S.q).reduce(function(a,b){return a+b},0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

$("fl").innerHTML=FL.map(function(f,i){return '<div class="row"><span>'+f+'</span><span class="st"><button data-i="'+i+'" data-d="-1">−</button><b id="q'+i+'">0</b><button data-i="'+i+'" data-d="1">+</button></span></div>'}).join("");
$("dt").value=iso(new Date());$("ref").value=iso(new Date());

function calc(){
  var u=units(),p=u*price(),f=S.type=="b2b"?(parseFloat($("fr").value)||0):0;
  $("pr").textContent=R(price())+" por unidade";
  $("su").textContent=u;$("sp").textContent=R(p);$("sf").textContent=R(f);$("stt").textContent=R(p+f);
  $("b2bbox").classList.toggle("hide",S.type!="b2b");
  $("vbox").classList.toggle("hide",!(S.type=="b2b"&&S.st=="pendente"));
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){["1","2"].forEach(function(n){$("v"+n).classList.toggle("hide",n!=b.dataset.t);$("t"+n).classList.toggle("on",n==b.dataset.t)});if(b.dataset.t=="2")rep();return}
  if(b.dataset.type){S.type=b.dataset.type;if(S.type!="b2b")S.st="pago";mark("[data-type]",b);mark("[data-st]",document.querySelector('[data-st="'+S.st+'"]'));calc();return}
  if(b.dataset.st){S.st=b.dataset.st;mark("[data-st]",b);if(S.st=="pendente"&&!$("venc").value)$("venc").value=add($("dt").value||iso(new Date()),C.prazo);calc();return}
  if(b.dataset.d){var i=b.dataset.i,v=Math.max(0,(S.q[i]||0)+ +b.dataset.d);S.q[i]=v;$("q"+i).textContent=v;calc();return}
  if(b.dataset.p){S.per=b.dataset.p;mark("[data-p]",b);rep();return}
  if(b.dataset.pay){api("/api/sales/"+b.dataset.pay+"/pay","POST").then(load);return}
  if(b.dataset.can){if(S.conf==b.dataset.can){var id=S.conf;S.conf=null;api("/api/sales/"+id+"/cancel","POST").then(load)}else{S.conf=b.dataset.can;rep()}return}
});
function mark(sel,btn){document.querySelectorAll(sel).forEach(function(x){x.classList.toggle("on",x===btn)})}
$("fr").oninput=calc;$("dt").onchange=function(){if(S.st=="pendente")$("venc").value=add($("dt").value,C.prazo)};$("ref").onchange=rep;

$("reg").onclick=function(){
  var u=units(),err="";
  if(!u)err="Escolha ao menos um sabor.";
  else if(S.type=="b2b"&&u<C.min)err="Venda B2B exige no mínimo "+C.min+" unidades. Faltam "+(C.min-u)+".";
  else if(!$("dt").value)err="Informe a data.";
  else if(S.st=="pendente"&&!$("venc").value)err="Informe o vencimento.";
  $("err").textContent=err;if(err)return;
  var items=[];FL.forEach(function(f,i){if(S.q[i])items.push({p:f,q:S.q[i]})});
  $("reg").disabled=true;
  api("/api/sales","POST",{date:$("dt").value,type:S.type,cli:$("cli").value.trim(),items:items,fr:$("fr").value,st:S.st,venc:$("venc").value}).then(function(){
    S.q={};FL.forEach(function(f,i){$("q"+i).textContent=0});$("cli").value="";$("fr").value="";$("dt").value=iso(new Date());
    S.st="pago";mark("[data-st]",document.querySelector('[data-st="pago"]'));calc();load();
    var t=$("toast");t.textContent="Venda registrada";t.classList.remove("hide");setTimeout(function(){t.classList.add("hide")},2000);
  }).catch(function(e){$("err").textContent=(e&&e.erro)||"Erro ao registrar. Tente de novo."}).then(function(){$("reg").disabled=false});
};

function rep(){
  var r=$("ref").value||iso(new Date()),a=r,z=r;
  if(S.per=="semana"){var d=new Date(r+"T12:00:00");a=add(r,-d.getDay());z=add(a,6)}
  if(S.per=="mes"){a=r.slice(0,8)+"01";var d2=new Date(r.slice(0,4),+r.slice(5,7),0);z=iso(d2)}
  $("rng").textContent=a==z?br(a):br(a)+" a "+br(z);
  var inr=sales.filter(function(s){return s.date>=a&&s.date<=z}),ok=inr.filter(function(s){return s.st!="cancelada"});
  $("rt").textContent=R(ok.reduce(function(t,s){return t+s.total},0));
  $("ru").textContent=ok.reduce(function(t,s){return t+s.u},0)+" unidades em "+ok.length+" vendas";
  var m={};ok.forEach(function(s){s.items.forEach(function(i){m[i.p]=(m[i.p]||0)+i.q})});
  var k=Object.keys(m).sort(function(x,y){return m[y]-m[x]});
  $("rf").innerHTML=k.length?k.map(function(n){return '<div class="row"><span>'+esc(n)+'</span><b>'+m[n]+'</b></div>'}).join(""):'<p class="sub">Nenhuma venda neste período.</p>';
  var pd=sales.filter(function(s){return s.st=="pendente"}).sort(function(x,y){return x.venc<y.venc?-1:1}),hoje=iso(new Date());
  $("pd").innerHTML=pd.length?pd.map(function(s){return '<div class="card"><b>'+esc(s.cli||"Sem nome")+'</b> '+R(s.total)+'<div class="sub">Vence em '+br(s.venc)+(s.venc<hoje?" (atrasada)":"")+'</div><button class="sm" data-pay="'+s.id+'">Marcar como pago</button></div>'}).join(""):'<p class="sub">Nada pendente.</p>';
  $("ls").innerHTML=inr.length?inr.slice().reverse().map(function(s){
    var tag=s.st=="pendente"?'<span class="tag p">pendente</span>':s.st=="cancelada"?'<span class="tag c">cancelada</span>':'<span class="tag">pago</span>';
    return '<div class="card"><b>'+esc(s.cli||"Sem nome")+'</b> '+tag+'<div class="sub">'+br(s.date)+" · "+(s.type=="b2b"?"B2B":"Final")+" · "+s.u+" un · "+R(s.total)+(s.fr?" (frete "+R(s.fr)+")":"")+'</div>'+(s.st!="cancelada"?'<button class="sm" data-can="'+s.id+'">'+(S.conf==s.id?"Confirmar cancelamento":"Cancelar")+'</button>':"")+'</div>'}).join(""):'<p class="sub">Nenhuma venda neste período.</p>';
}
function boot(){api("/api/me").then(function(u){ME=u;$("lg").classList.add("hide");$("t2").classList.toggle("hide",u.role!="admin");$("who").textContent=u.name;return load()}).catch(function(){$("lg").classList.remove("hide")})}
$("lgb").onclick=function(){api("/api/login","POST",{u:$("lu").value,p:$("lp").value}).then(boot).catch(function(){$("lge").textContent="Usuário ou senha incorretos."})};
calc();boot();
</script></body></html>
